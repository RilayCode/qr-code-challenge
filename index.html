<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Frontend Mentor QR code component challenge - scan the QR code to visit Frontend Mentor.">
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
  <title>QR code card challenge</title>
  <link rel="icon" href="images/favicon-32x32.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card">
      <div class="img">
        <img src="images/image-qr-code.png" alt="qr code" width="576" height="576">
      </div>
      <div class="detail">
        <h1>
          <span class="sr-only">Improve your front-end skills by buiding projects</span>
          <span class="typewriter" aria-hidden="true"></span>
        </h1>
        <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
